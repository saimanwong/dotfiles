---

- name: Remove deprecated Pi Coding Agent npm package
  community.general.npm:
    name: "@mariozechner/pi-coding-agent"
    global: true
    state: absent

- name: Install Pi Coding Agent globally via npm
  community.general.npm:
    name: "@earendil-works/pi-coding-agent"
    global: true
    state: present

- name: Check installed Pi packages
  ansible.builtin.command: pi list
  register: pi_packages_list
  changed_when: false
  failed_when: false

- name: Install pi-subagents Pi package
  ansible.builtin.command: pi install npm:pi-subagents
  when: "'pi-subagents' not in pi_packages_list.stdout"

- name: Install pi-codex-fast Pi package
  ansible.builtin.command: pi install npm:pi-codex-fast
  when: "'pi-codex-fast' not in pi_packages_list.stdout"

- name: Install pi-intercom Pi package
  ansible.builtin.command: pi install npm:pi-intercom
  when: "'pi-intercom' not in pi_packages_list.stdout"

- name: Install pi-mcp-adapter Pi package
  ansible.builtin.command: pi install npm:pi-mcp-adapter@2.24.0
  when: "'npm:pi-mcp-adapter@2.24.0' not in pi_packages_list.stdout"

- name: Install ByteTrue web search Pi package
  ansible.builtin.command: pi install npm:@bytetrue/pi-web-search@0.2.1
  when: "'npm:@bytetrue/pi-web-search@0.2.1' not in pi_packages_list.stdout"

- name: Install Ponytail Pi package
  ansible.builtin.command: pi install npm:@dietrichgebert/ponytail@4.9.0
  when: "'npm:@dietrichgebert/ponytail@4.9.0' not in pi_packages_list.stdout"

- name: Install FFF Pi package
  ansible.builtin.command: pi install npm:@ff-labs/pi-fff@0.10.5
  when: "'npm:@ff-labs/pi-fff@0.10.5' not in pi_packages_list.stdout"

- name: Install rpiv-todo Pi package
  ansible.builtin.command: pi install npm:@juicesharp/rpiv-todo@2.6.0
  when: "'npm:@juicesharp/rpiv-todo@2.6.0' not in pi_packages_list.stdout"

- name: Ensure global Agent Skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.agents/skills"
    state: directory
    mode: '0755'

- name: Soft link shared skills directory into global Agent Skills directory
  ansible.builtin.file:
    src: "{{ playbook_dir }}/files/agent-config/skills"
    dest: "{{ ansible_facts.env.HOME }}/.agents/skills/agent-config"
    force: true
    state: link

- name: Ensure Pi agent config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.pi/agent"
    state: directory
    mode: '0755'

- name: Gather Pi themes path info
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.pi/agent/themes"
    follow: false
  register: pi_themes_path

- name: Backup existing non-directory Pi themes path before symlinking
  ansible.builtin.command:
    cmd: >
      mv
      "{{ ansible_facts.env.HOME }}/.pi/agent/themes"
      "{{ ansible_facts.env.HOME }}/.pi/agent/themes.pre-shared-link.{{ ansible_facts['date_time']['epoch'] }}"
  when:
    - pi_themes_path.stat.exists
    - not (pi_themes_path.stat.isdir | default(false))
    - not (pi_themes_path.stat.islnk | default(false))

- name: Soft link shared Pi themes directory when no themes directory exists
  ansible.builtin.file:
    src: "{{ playbook_dir }}/files/agent-config/pi-themes"
    dest: "{{ ansible_facts.env.HOME }}/.pi/agent/themes"
    force: true
    state: link
  when: >
    not pi_themes_path.stat.exists or
    (not (pi_themes_path.stat.isdir | default(false)) and
    not (pi_themes_path.stat.islnk | default(false)))

- name: Gather Pi Ayu Calm theme path info
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.pi/agent/themes/ayu-calm.json"
    follow: false
  register: pi_ayu_calm_theme_path
  when:
    - pi_themes_path.stat.exists
    - pi_themes_path.stat.isdir | default(false)
    - not (pi_themes_path.stat.islnk | default(false))

- name: Backup existing Pi Ayu Calm theme before symlinking into existing themes directory
  ansible.builtin.command:
    cmd: >
      mv
      "{{ ansible_facts.env.HOME }}/.pi/agent/themes/ayu-calm.json"
      "{{ ansible_facts.env.HOME }}/.pi/agent/themes/ayu-calm.json.pre-shared-link.{{ ansible_facts['date_time']['epoch'] }}"
  when:
    - pi_themes_path.stat.exists
    - pi_themes_path.stat.isdir | default(false)
    - not (pi_themes_path.stat.islnk | default(false))
    - pi_ayu_calm_theme_path.stat.exists
    - not (pi_ayu_calm_theme_path.stat.islnk | default(false))

- name: Soft link shared Pi Ayu Calm theme into existing themes directory
  ansible.builtin.file:
    src: "{{ playbook_dir }}/files/agent-config/pi-themes/ayu-calm.json"
    dest: "{{ ansible_facts.env.HOME }}/.pi/agent/themes/ayu-calm.json"
    force: true
    state: link
  when:
    - pi_themes_path.stat.exists
    - pi_themes_path.stat.isdir | default(false)
    - not (pi_themes_path.stat.islnk | default(false))

- name: Ensure Pi settings include shared defaults
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import os
        from pathlib import Path

        path = Path(os.environ["HOME"]) / ".pi" / "agent" / "settings.json"
        data = {}
        if path.exists() and path.read_text().strip():
            data = json.loads(path.read_text())

        defaults_path = Path(os.environ["PI_SETTINGS_DEFAULTS"])
        desired = json.loads(defaults_path.read_text())
        changed = False

        filtered_packages = {
            item["source"]: item
            for item in desired["packages"]
            if isinstance(item, dict)
        }
        packages = []
        filtered_packages_added = set()
        for item in data.get("packages", []):
            source = item if isinstance(item, str) else item.get("source")
            if source in filtered_packages:
                if source not in filtered_packages_added:
                    packages.append(filtered_packages[source])
                    filtered_packages_added.add(source)
            else:
                packages.append(item)
        if packages != data.get("packages", []):
            data["packages"] = packages
            changed = True

        if data.get("subagents") != desired["subagents"]:
            data["subagents"] = desired["subagents"]
            changed = True

        for key, retired in (
            ("extensions", "-extensions/linear.ts"),
            ("skills", "-skills/linear-issue-pane-worker/SKILL.md"),
        ):
            if retired in data.get(key, []):
                data[key].remove(retired)
                if not data[key]:
                    del data[key]
                changed = True

        def merge(current, desired):
            changed = False
            for key, desired_value in desired.items():
                current_value = current.get(key)
                if isinstance(desired_value, dict):
                    if not isinstance(current_value, dict):
                        current_value = {}
                        current[key] = current_value
                        changed = True
                    if merge(current_value, desired_value):
                        changed = True
                elif isinstance(desired_value, list):
                    if not isinstance(current_value, list):
                        current[key] = list(desired_value)
                        changed = True
                    else:
                        for item in desired_value:
                            if item not in current_value:
                                current_value.append(item)
                                changed = True
                elif current_value != desired_value:
                    current[key] = desired_value
                    changed = True
            return changed

        if merge(data, desired):
            changed = True

        if changed:
            path.write_text(json.dumps(data, indent=2) + "\n")
            print("changed")
  register: pi_settings_defaults
  changed_when: '"changed" in pi_settings_defaults.stdout'
  environment:
    HOME: "{{ ansible_facts.env.HOME }}"
    PI_SETTINGS_DEFAULTS: "{{ playbook_dir }}/files/agent-config/pi-settings-defaults.json"

- name: Link shared Pi agent-config paths
  ansible.builtin.include_role:
    name: agent_symlinks
  vars:
    agent_symlinks:
      - { src: "{{ playbook_dir }}/files/agent-config/pi-skills", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/skills" }
      - { src: "{{ ansible_facts.env.HOME }}/.pi/agent/npm/node_modules", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/node_modules" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-extensions", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/extensions" }
      - { src: "{{ playbook_dir }}/files/agent-config/tmux-window-activity.mjs", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/tmux-window-activity.mjs" }
      - { src: "{{ playbook_dir }}/files/agent-config/tmux-window-activity.d.mts", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/tmux-window-activity.d.mts" }
      - { src: "{{ playbook_dir }}/files/agent-config/shared-tools", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/shared-tools" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-agents", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/agents" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-prompts", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/prompts" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-keybindings.json", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/keybindings.json" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-mcp.json", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/mcp.json" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-models.json", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/models.json" }
      - { src: "{{ playbook_dir }}/files/agent-config/pi-AGENTS.md", dest: "{{ ansible_facts.env.HOME }}/.pi/agent/AGENTS.md" }
